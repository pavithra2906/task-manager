
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header class="header">
            <div>
                <h1>TaskFlow</h1>
                <p>Organize your day, one task at a time.</p>
            </div>
            <div class="date" id="currentDate"></div>
        </header>

        <section class="welcome">
            <h2>My Tasks</h2>
            <p>Stay focused and get things done!</p>
        </section>

        <section class="stats">
            <div class="stat-card">
                <span>Total Tasks</span>
                <h2 id="totalTasks">0</h2>
            </div>

            <div class="stat-card">
                <span>Pending</span>
                <h2 id="pendingTasks">0</h2>
            </div>

            <div class="stat-card">
                <span>Completed</span>
                <h2 id="completedTasks">0</h2>
            </div>
        </section>

        <section class="progress-section">
            <div class="progress-heading">
                <h3>Daily Progress</h3>
                <span id="progressText">0%</span>
            </div>
            <div class="progress-bar">
                <div id="progressFill"></div>
            </div>
        </section>

        <section class="add-section">
            <h3>Add a New Task</h3>

            <form id="taskForm">
                <input
                    type="text"
                    id="taskInput"
                    placeholder="What do you need to do?"
                    maxlength="100"
                    required
                >
                <button type="submit">+ Add Task</button>
            </form>
        </section>

        <section class="task-section">
            <div class="task-heading">
                <h3>My Checklist</h3>

                <div class="filters">
                    <button class="filter active" data-filter="all">All</button>
                    <button class="filter" data-filter="pending">Pending</button>
                    <button class="filter" data-filter="completed">Completed</button>
                </div>
            </div>

            <div id="taskList" class="task-list"></div>

            <p id="emptyMessage" class="empty-message">
                No tasks yet. Add your first task!
            </p>
        </section>

        <footer>
            <p>TaskFlow © 2026 | Manage your tasks easily.</p>
        </footer>

    </div>

    <script src="script.js"></script>
</body>
</html>
